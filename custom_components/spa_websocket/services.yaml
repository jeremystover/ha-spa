send_raw:
  name: Send raw command
  description: >-
    Send a single raw command code to the spa over its WebSocket. Diagnostic
    tool for mapping the spa's undocumented command codes (known so far:
    "3" toggles jets, "4" toggles filter).
  fields:
    code:
      name: Code
      description: The raw command code to send, e.g. "3".
      required: true
      example: "3"
      selector:
        text:

set_time:
  name: Set time
  description: >-
    Set the spa's clock to the current time. The filter cycles are programmed
    against this clock and it does not survive a power cut, so re-asserting it
    on a schedule is what keeps the filter window lined up with the setpoint.
    The clock cannot be read back, so this always writes rather than checking
    first -- which is harmless, since writing the correct time to an already
    correct clock changes nothing.
  fields:
    timezone:
      name: Timezone
      description: >-
        IANA timezone the spa is physically in. Defaults to Home Assistant's own
        timezone, which is only right when the spa sits in the same zone as the
        Home Assistant host.
      required: false
      example: America/Los_Angeles
      selector:
        text:

take_reading:
  name: Take a reading
  description: >-
    Connect to the spa, wait for the panel to report, and hang up. This is what
    answers the question a confirmed setpoint cannot: the spa accepting 103F
    says nothing about whether the water actually moved, and only a reading
    taken at the checkpoint does. Records a failed "reading" job -- visible on
    the Action failed sensor -- if the panel says nothing in the window, because
    "I could not look" has to be distinguishable from "I looked and it was fine".
  fields:
    seconds:
      name: Listening window
      description: >-
        How long to wait for the panel to speak, in seconds. Returns as soon as
        a frame arrives, so only silence costs the full window. Display frames
        are bursty -- gaps of ten to thirty minutes are normal on a healthy spa
        -- so a scheduled check should allow minutes, not seconds. Defaults to
        the same short window the Refresh button uses.
      required: false
      example: 300
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: seconds
